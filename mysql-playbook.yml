# MySQL Slave Setup
# Usage: ansible-playbook -i inventory/hosts mysql-playbook.yml
- hosts: mysql-slave
  become: yes
  roles:
    - role: ansible-role-mysql
      mysql_db: none
      mysql_users: none
      mysql_repl_role: slave
      mysql_repl_master: "{{ hostvars[groups['mysql-master'][0]]['ansible_host'] }}"
      mysql_db_id: 9
      mysql_repl_user:
        - { name: repl, pass: "{{ mysql_repl_password | default('changeme') }}" }
